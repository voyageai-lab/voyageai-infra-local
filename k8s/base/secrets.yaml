# =============================================================================
# VoyageAI Secrets
# =============================================================================
# IMPORTANT: In production, use sealed-secrets, external-secrets, or Vault.
# This file is for local / dev K8s (kind) only. NEVER commit real secrets.
#
# After editing, re-apply with:
#   kubectl apply -f k8s/base/secrets.yaml
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: voyageai-secrets
  namespace: voyageai
  labels:
    app.kubernetes.io/part-of: voyageai
type: Opaque
stringData:
  # ---- MySQL ----
  MYSQL_ROOT_PASSWORD: "voyageai123"
  SPRING_DATASOURCE_PASSWORD: "voyageai123"

  # ---- JWT ----
  JWT_SECRET: "mySecretKeyForJWT123456789012345678901234567890"

  # ---- OpenAI ----
  # Replace with your real API key
  OPENAI_API_KEY: "sk-placeholder-replace-with-real-key"

  # ---- Google OAuth2 (optional) ----
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""
